services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: personalizer
      POSTGRES_PASSWORD: personalizer
      POSTGRES_DB: personalizer
    ports: ["5433:5432"]   # 5433 so it does not clash with a local Postgres on 5432
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6380:6379"]   # 6380 so it does not clash with a local Redis
volumes:
  pgdata:
